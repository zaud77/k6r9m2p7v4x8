name: Check build workspace
'on':
  push:
    branches:
    - main
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
        persist-credentials: false
    - name: Prepare pinned build inputs
      uses: ./.github/actions/private-inputs
      with:
        repository: ${{ secrets.SOURCE_REPOSITORY }}
        revision: ${{ secrets.SOURCE_REVISION }}
        key: ${{ secrets.SOURCE_READ_KEY }}
        submodules: 'true'
        dependency-keys: ${{ secrets.DEPENDENCY_SSH_KEYS }}
    - name: Run private build pipeline
      id: pipeline
      uses: ./ci/actions/check-workspace/check
    - name: Clear dependency access
      if: ${{ always() }}
      uses: ./.github/actions/dependency-access
      with:
        cleanup: 'true'
  appcloak:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Prepare pinned build inputs
      uses: ./.github/actions/private-inputs
      with:
        repository: ${{ secrets.SOURCE_REPOSITORY }}
        revision: ${{ secrets.SOURCE_REVISION }}
        key: ${{ secrets.SOURCE_READ_KEY }}
        submodules: 'false'
        dependency-keys: ${{ secrets.DEPENDENCY_SSH_KEYS }}
    - name: Run private build pipeline
      id: pipeline
      uses: ./ci/actions/check-workspace/appcloak
    - name: Clear dependency access
      if: ${{ always() }}
      uses: ./.github/actions/dependency-access
      with:
        cleanup: 'true'
  userspace:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Prepare pinned build inputs
      uses: ./.github/actions/private-inputs
      with:
        repository: ${{ secrets.SOURCE_REPOSITORY }}
        revision: ${{ secrets.SOURCE_REVISION }}
        key: ${{ secrets.SOURCE_READ_KEY }}
        submodules: 'false'
        dependency-keys: ${{ secrets.DEPENDENCY_SSH_KEYS }}
    - name: Run private build pipeline
      id: pipeline
      uses: ./ci/actions/check-workspace/userspace
    - name: Clear dependency access
      if: ${{ always() }}
      uses: ./.github/actions/dependency-access
      with:
        cleanup: 'true'
