name: Clean private build diagnostics
'on':
  workflow_dispatch: {}
  schedule:
  - cron: 17 3 */3 * *
permissions:
  contents: read
concurrency:
  group: private-build-diagnostics-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        submodules: false
    - name: Prepare pinned build inputs
      uses: ./.github/actions/private-inputs
      with:
        repository: ${{ secrets.SOURCE_REPOSITORY }}
        revision: ${{ secrets.SOURCE_REVISION }}
        key: ${{ secrets.SOURCE_READ_KEY }}
        submodules: 'false'
        dependency-keys: '{}'
        privacy-key: ${{ secrets.BUILD_PRIVACY_KEY }}
    - name: Remove expired private diagnostics
      shell: bash
      env:
        DIAGNOSTICS_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
        BUILD_DIAGNOSTICS_TOKEN: ${{ secrets.BUILD_DIAGNOSTICS_TOKEN }}
      run: python3 "$GITHUB_WORKSPACE/ci/run_pipeline_step.py" --cleanup-diagnostics
